name: Feature idea
description: Suggest something Benchplan should do.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Benchplan to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you building, and how would this help?
      description: A real project helps a lot — "I build kitchen cabinets and I need...".
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In Benchplan, another program, or on paper.
